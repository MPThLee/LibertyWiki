openapi: 3.1.0
x-release-validation-profile: ./release_profile_1_0.json
x-implementation-status: DESIGN_NOT_EXECUTED
info:
  title: LibertyWiki Native REST API (Draft)
  version: 1.1.0-draft
  description: Native RESTful 공개 API 대표 계약 설계 초안. /w/api.php 및 /w/rest.php/* 는 별도 MediaWiki Compatible API 계열이며 이 문서는 그 전체 계약이
    아님. 신규 MediaWiki API에는 반드시 Native 동등 operation을 추가해야 함. 전체 API 목록 미완료.
servers:
- url: https://wiki.example.invalid/api/v1
  description: Native RESTful API only
security:
- bearerAuth: []
tags:
- name: Pages
- name: Revisions
- name: Search
- name: Uploads
- name: Admin
- name: Extensions
- name: Users
- name: Watchlist
- name: Media
- name: Site
- name: Parser
paths:
  /pages:
    post:
      tags:
      - Pages
      summary: 문서 생성
      operationId: createPage
      description: 내부 시험용 일반 이름공간 Wikitext 생성. 같은 정규화 제목으로 다시 요청하면 409가 반환된다.
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSourcePage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Invalid'
  /pages/{pageId}/revisions:
    get:
      tags:
      - Revisions
      summary: 문서 리비전 이력 조회
      operationId: getRevisions
      description: >-
        내부 시험용 일반 이름공간 문서의 이력을 시각 역순으로 반환한다. 동일 시각은 숫자 리비전 ID의 역순으로 정렬한다.
        응답에는 Cache-Control no-store를 적용한다.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/PageId'
      - name: cursor
        in: query
        required: false
        description: 직전 응답의 nextCursor. 해당 리비전을 제외하고 더 오래된 항목을 반환한다.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Revision history
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionHistory'
        '400':
          description: INVALID_CURSOR or INVALID_LIMIT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: PAGE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: INVALID_PAGE_ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Revisions
      operationId: commitRevision
      summary: 새 불변 리비전 생성
      description: >-
        내부 시험용 일반 이름공간 Wikitext 원문 편집. 현재 리비전 ID를
        baseRevisionId로 제출한다. 저장에 성공하면 새 현재 리비전과 원문을
        반환한다. 같은 기준 리비전으로 다시 요청하면 409가 반환된다.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '201':
          description: Revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSourcePage'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: PAGE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: EDIT_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Invalid'
  /parse:
    post:
      tags:
      - Pages
      operationId: parseWikitext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              properties:
                source:
                  type: string
                  maxLength: 3000000
                title:
                  type: string
                namespaceId:
                  type: integer
      responses:
        '200':
          description: Sanitized HTML and parser diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  html:
                    type: string
                  diagnostics:
                    type: array
                    items:
                      type: object
  /search:
    get:
      tags:
      - Search
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: namespaceId
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
        '503':
          $ref: '#/components/responses/Unavailable'
  /files/uploads:
    post:
      tags:
      - Uploads
      operationId: beginUpload
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - byteSize
              - sha256
              - mimeType
              properties:
                name:
                  type: string
                byteSize:
                  type: integer
                  minimum: 1
                sha256:
                  type: string
                  pattern: ^[A-Fa-f0-9]{64}$
                mimeType:
                  type: string
      responses:
        '201':
          description: Upload session
          content:
            application/json:
              schema:
                type: object
                required:
                - uploadId
                - state
                properties:
                  uploadId:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum:
                    - PENDING
                  uploadUrl:
                    type: string
                    format: uri
                    description: Allowed only for authorized temporary storage targets
        '403':
          $ref: '#/components/responses/Forbidden'
  /pages/by-title/{title}:
    get:
      tags:
      - Pages
      summary: CAP-PAGE-READ-TITLE
      operationId: getPageByTitle
      security:
      - bearerAuth: []
      - {}
      parameters:
      - name: title
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current Wikitext source
