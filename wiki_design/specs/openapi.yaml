components:
  headers:
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
  parameters:
    PageId:
      name: pageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Page:
      type: object
      required:
      - id
      - namespaceId
      - normalizedTitle
      - currentRevisionId
      - status
      properties:
        id:
          type: string
          format: uuid
        namespaceId:
          type: integer
        normalizedTitle:
          type: string
        currentRevisionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACTIVE
          - DELETED
          - SUPPRESSED
        redirectTarget:
          type:
          - string
          - 'null'
    CurrentSourcePage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        required: [source, contentModel, createdAt]
        properties:
          source:
            type: string
          contentModel:
            const: wikitext
          createdAt:
            type: string
            format: date-time
    RevisionHistoryEntry:
      type: object
      required: [id, parentRevisionId, createdAt, summary]
      properties:
        id:
          type: string
          format: uuid
        parentRevisionId:
          type:
          - string
          - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
        summary:
          type: string
    RevisionHistory:
      type: object
      required: [revisions, nextCursor]
      properties:
        revisions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RevisionHistoryEntry'
        nextCursor:
          type: [string, 'null']
          format: uuid
          description: 다음 페이지가 있으면 이 응답의 마지막 리비전 UUID. 마지막 페이지이면 null.
    RevisionSource:
      allOf:
      - $ref: '#/components/schemas/RevisionHistoryEntry'
      - type: object
        required: [pageId, normalizedTitle, source, contentModel]
        properties:
          pageId:
            type: string
            format: uuid
          normalizedTitle:
            type: string
          source:
            type: string
          contentModel:
            const: wikitext
    CreatePageRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - namespaceId
      - source
      properties:
        title:
          type: string
          minLength: 1
        namespaceId:
          type: integer
          const: 0
        source:
          type: string
          description: UTF-8 기준 최대 1048576바이트의 Wikitext
        summary:
          type: string
          maxLength: 500
    RevisionRequest:
      type: object
      additionalProperties: false
      required:
      - baseRevisionId
      - source
      properties:
        source:
          type: string
          description: UTF-8 기준 최대 1048576바이트의 Wikitext
        baseRevisionId:
          type: string
          format: uuid
        summary:
          type: string
          maxLength: 500
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
  responses:
    Unauthorized:
      description: Invalid Bearer credential
      headers:
        WWW-Authenticate:
          schema:
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Expected application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Dependent service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
x-api-families:
  mediaWikiCompatible:
    actionApi: /w/api.php
    mediaWikiRestApi: /w/rest.php/*
  nativeRestful: /api/v1/*
x-release-policy: 모든 신규 MediaWiki 버전의 API/기능 업데이트 시 MediaWiki Compatible과 Native RESTful을 동시 구현·테스트.
