openapi: 3.1.0
info:
  title: LibertyWiki Native REST API (Draft)
  version: 1.1.0-draft
  description: Native RESTful 공개 API 대표 계약 설계 초안. /w/api.php 및 /w/rest.php/* 는 별도 MediaWiki Compatible API 계열이며 이 문서는 그 전체 계약이
    아님. 신규 MediaWiki API에는 반드시 Native 동등 operation을 추가해야 함. 전체 API 목록 미완료.
servers:
- url: https://wiki.example.invalid/api/v1
  description: Native RESTful API only
security:
- bearerAuth: []
tags:
- name: Pages
- name: Revisions
- name: Search
- name: Uploads
- name: Admin
- name: Extensions
- name: Users
- name: Watchlist
- name: Media
- name: Site
- name: Parser
paths:
  /pages:
    post:
      tags:
      - Pages
      summary: 문서 생성
      operationId: createPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pages/{pageId}:
    get:
      tags:
      - Pages
      summary: 문서 조회
      operationId: getPage
      parameters:
      - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          $ref: '#/components/responses/NotFound'
  /pages/{pageId}/revisions:
    get:
      tags:
      - Revisions
      operationId: getRevisions
      parameters:
      - $ref: '#/components/parameters/PageId'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Revision list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Revision'
                  nextCursor:
                    type:
                    - string
                    - 'null'
    post:
      tags:
      - Revisions
      operationId: commitRevision
      summary: 새 불변 리비전 생성
      parameters:
      - $ref: '#/components/parameters/PageId'
      - name: If-Match
        in: header
        required: false
        description: baseRevisionId를 대신하는 ETag; 둘 중 최소 하나 제출
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '201':
          description: Revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
  /parse:
    post:
      tags:
      - Pages
      operationId: parseWikitext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              properties:
                source:
                  type: string
                  maxLength: 3000000
                title:
                  type: string
                namespaceId:
                  type: integer
      responses:
        '200':
          description: Sanitized HTML and parser diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  html:
                    type: string
                  diagnostics:
                    type: array
                    items:
                      type: object
  /search:
    get:
      tags:
      - Search
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: namespaceId
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
        '503':
          $ref: '#/components/responses/Unavailable'
  /files/uploads:
    post:
      tags:
      - Uploads
      operationId: beginUpload
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - byteSize
              - sha256
              - mimeType
              properties:
                name:
                  type: string
                byteSize:
                  type: integer
                  minimum: 1
                sha256:
                  type: string
                  pattern: ^[A-Fa-f0-9]{64}$
                mimeType:
                  type: string
      responses:
        '201':
          description: Upload session
          content:
            application/json:
              schema:
                type: object
                required:
                - uploadId
                - state
                properties:
                  uploadId:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum:
                    - PENDING
                  uploadUrl:
                    type: string
                    format: uri
                    description: Allowed only for authorized temporary storage targets
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/pages/by-title/{title}:
