        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
  /revisions/{revisionId}:
    get:
      tags:
      - Revisions
      summary: 리비전 원문 조회
      operationId: getRevision
      description: >-
        내부 시험용 일반 이름공간 문서의 특정 리비전에 저장된 Wikitext를 반환한다.
        응답에는 Cache-Control no-store를 적용한다.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - name: revisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Stored revision source
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: REVISION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: INVALID_REVISION_ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pages/{pageId}/moves:
