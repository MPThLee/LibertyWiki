components:
  parameters:
    PageId:
      name: pageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Page:
      type: object
      required:
      - id
      - namespaceId
      - normalizedTitle
      - currentRevisionId
      - status
      properties:
        id:
          type: string
          format: uuid
        namespaceId:
          type: integer
        normalizedTitle:
          type: string
        currentRevisionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACTIVE
          - DELETED
          - SUPPRESSED
        redirectTarget:
          type:
          - string
          - 'null'
    Revision:
      type: object
      required:
      - id
      - pageId
      - sourceSha256
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        pageId:
          type: string
          format: uuid
        parentRevisionId:
          type:
          - string
          - 'null'
          format: uuid
        sourceSha256:
          type: string
        createdAt:
          type: string
          format: date-time
        summary:
          type: string
    CreatePageRequest:
      type: object
      required:
      - title
      - namespaceId
      - source
      properties:
        title:
          type: string
          minLength: 1
        namespaceId:
          type: integer
        source:
          type: string
        summary:
          type: string
    RevisionRequest:
      type: object
      required:
      - source
      properties:
        source:
          type: string
        baseRevisionId:
          type: string
          format: uuid
        summary:
          type: string
          maxLength: 500
        minorEdit:
          type: boolean
          default: false
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
  responses:
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Dependent service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
x-api-families:
  mediaWikiCompatible:
    actionApi: /w/api.php
    mediaWikiRestApi: /w/rest.php/*
  nativeRestful: /api/v1/*
